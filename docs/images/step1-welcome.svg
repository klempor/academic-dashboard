<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="emeraldCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect width="760" height="430" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top App Logo -->
  <rect x="352" y="24" width="56" height="56" rx="14" fill="url(#logoGrad)"/>
  <path d="M380 36 L400 46 L380 56 L360 46 Z" fill="#ffffff"/>
  <path d="M368 52 V63 C368 68 392 68 392 63 V52 L380 58 Z" fill="#e0f2fe"/>
  <line x1="397" y1="48" x2="397" y2="62" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Welcome Title -->
  <text x="380" y="106" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="800">ברוכים הבאים ל-Academic Dashboard!</text>
  <text x="380" y="128" text-anchor="middle" fill="#94a3b8" font-size="12.5">המקום המרכזי לניהול הסמסטר: מעקב יחידות לימוד, לו"ז שבועי מאוחד ומטלות</text>

  <!-- Step 1: Semester Period Card -->
  <rect x="115" y="148" width="530" height="64" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-opacity="0.5" stroke-width="1.2"/>
  <rect x="592" y="162" width="36" height="36" rx="10" fill="#0ea5e9" fill-opacity="0.18" stroke="#0ea5e9" stroke-opacity="0.4"/>
  <text x="610" y="185" text-anchor="middle" fill="#38bdf8" font-size="16">📅</text>
  <text x="580" y="176" text-anchor="end" fill="#e2e8f0" font-size="12" font-weight="700">תקופת הסמסטר הנוכחית</text>
  <text x="580" y="196" text-anchor="end" fill="#7dd3fc" font-size="13" font-weight="700" font-family="Consolas, monospace">25/10/2026 - 31/01/2027</text>

  <rect x="132" y="164" width="114" height="32" rx="9" fill="#0284c7" fill-opacity="0.28" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="189" y="184" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">✏️ הגדר תאריכים</text>

  <!-- Callout Badge 1 -->
  <circle cx="88" cy="180" r="14" fill="#0284c7"/>
  <text x="88" y="185" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">1</text>

  <!-- Step 2: Primary JSON Load Card -->
  <rect x="115" y="226" width="530" height="114" rx="16" fill="url(#emeraldCardGrad)" stroke="#10b981" stroke-width="1.8"/>
  <rect x="586" y="244" width="44" height="44" rx="12" fill="#10b981"/>
  <text x="608" y="272" text-anchor="middle" fill="#022c22" font-size="19" font-weight="800">📥</text>

  <text x="574" y="262" text-anchor="end" fill="#ffffff" font-size="15" font-weight="800">טעינת קורס מוכן מקובץ JSON</text>
  <rect x="305" y="247" width="112" height="20" rx="10" fill="#10b981" fill-opacity="0.22" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="361" y="261" text-anchor="middle" fill="#6ee7b7" font-size="10.5" font-weight="700">מומלץ • חוסך זמן</text>

  <text x="574" y="283" text-anchor="end" fill="#cbd5e1" font-size="11.5">טען קובץ קורס מוכן ממאגר הקהילה או מקובץ שקיבלת מחבר לספסל הלימודים</text>

  <line x1="135" y1="298" x2="625" y2="298" stroke="#10b981" stroke-opacity="0.25"/>
  <text x="625" y="321" text-anchor="end" fill="#94a3b8" font-size="11.5">עדיין אין לך קובץ?</text>
  <rect x="135" y="305" width="215" height="25" rx="7" fill="#0f172a" stroke="#10b981" stroke-opacity="0.45"/>
  <text x="242" y="321" text-anchor="middle" fill="#6ee7b7" font-size="11.5" font-weight="700">↗ חפש את הקורס שלך במאגר הקהילתי</text>

  <!-- Callout Badge 2 -->
  <circle cx="88" cy="283" r="14" fill="#10b981"/>
  <text x="88" y="288" text-anchor="middle" fill="#022c22" font-size="13" font-weight="800">2</text>

  <!-- Step 3: Secondary Manual Link -->
  <text x="380" y="366" text-anchor="middle" fill="#94a3b8" font-size="12">
    הקורס שלך לא במאגר? <tspan fill="#e2e8f0" font-weight="700" text-decoration="underline">צור קורס חדש באופן ידני</tspan>
  </text>
  <circle cx="88" cy="362" r="14" fill="#475569"/>
  <text x="88" y="367" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">3</text>

  <!-- Bottom Demo Button -->
  <line x1="115" y1="384" x2="645" y2="384" stroke="#1e293b"/>
  <rect x="255" y="393" width="250" height="26" rx="7" fill="#1e293b" stroke="#334155"/>
  <text x="380" y="410" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">✨ רוצה להתרשם קודם? טען קורסים לדוגמה</text>
</svg>