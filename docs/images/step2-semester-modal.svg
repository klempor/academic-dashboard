<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" font-family="Segoe UI, Arial, sans-serif">
  <!-- Modal Background -->
  <rect width="640" height="310" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="612" y="38" text-anchor="end" fill="#ffffff" font-size="15" font-weight="800">📅 הגדרת תאריכי הסמסטר</text>
  <text x="32" y="38" text-anchor="start" fill="#94a3b8" font-size="15">✕</text>
  <line x1="24" y1="52" x2="616" y2="52" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Description -->
  <text x="612" y="74" text-anchor="end" fill="#94a3b8" font-size="12">הגדר את תאריך תחילת שבוע 1 ואת תאריך סוף הסמסטר לחישוב אוטומטי של שבועות הלימוד:</text>

  <!-- Date Inputs Row -->
  <text x="612" y="102" text-anchor="end" fill="#cbd5e1" font-size="12" font-weight="700">תחילת הסמסטר (שבוע 1):</text>
  <rect x="330" y="110" width="282" height="36" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="596" y="133" text-anchor="end" fill="#ffffff" font-size="13" font-family="Consolas, monospace">25/10/2026</text>
  <text x="346" y="133" text-anchor="start" fill="#94a3b8" font-size="13">🗓️</text>

  <text x="308" y="102" text-anchor="end" fill="#cbd5e1" font-size="12" font-weight="700">סוף הסמסטר:</text>
  <rect x="28" y="110" width="280" height="36" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="292" y="133" text-anchor="end" fill="#ffffff" font-size="13" font-family="Consolas, monospace">31/01/2027</text>
  <text x="44" y="133" text-anchor="start" fill="#94a3b8" font-size="13">🗓️</text>

  <!-- Quick Presets Label -->
  <text x="612" y="172" text-anchor="end" fill="#94a3b8" font-size="11.5" font-weight="700">הגדרה מהירה לפי מוסד לימודים:</text>

  <!-- Open University Preset -->
  <rect x="330" y="182" width="282" height="52" rx="10" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="471" y="204" text-anchor="middle" fill="#7dd3fc" font-size="12.5" font-weight="800">האוניברסיטה הפתוחה</text>
  <text x="471" y="222" text-anchor="middle" fill="#bae6fd" font-size="11" font-family="Consolas, monospace">25/10/2026 – 31/01/2027</text>

  <!-- Hebrew University Preset -->
  <rect x="28" y="182" width="280" height="52" rx="10" fill="#059669" fill-opacity="0.22" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="168" y="204" text-anchor="middle" fill="#6ee7b7" font-size="12.5" font-weight="800">האוניברסיטה העברית</text>
  <text x="168" y="222" text-anchor="middle" fill="#a7f3d0" font-size="11" font-family="Consolas, monospace">11/10/2026 – 17/01/2027</text>

  <!-- Footer Buttons -->
  <line x1="24" y1="252" x2="616" y2="252" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="28" y="264" width="112" height="32" rx="8" fill="#0284c7"/>
  <text x="84" y="284" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">שמור הגדרות</text>

  <rect x="150" y="264" width="76" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="188" y="284" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700">ביטול</text>
</svg>